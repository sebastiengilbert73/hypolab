[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypolab"
version = "0.1.0"
description = "Autonomous Data Scientist Agent for statistical hypothesis generation and testing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sebastien Gilbert" }
]
dependencies = [
    "pydantic>=2.6.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "plotly>=5.20.0",
    "litellm>=1.40.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
hypolab = "hypolab.cli:main"

[tool.setuptools.packages.find]
include = ["hypolab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
